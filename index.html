*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,Inter,system-ui,sans-serif}

</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),K='arrowscope.v2',DAY=864e5,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:r&3|8).toString(16)})).toUpperCase();
const now=()=>new Date().toISOString().replace(/\.\d+Z$/,'Z'),f=(v,d=2)=>Number(v).toFixed(d).replace('.',',');
const blank=()=>({settings:{language:'it',theme:'system',accent:'warm'},profile:{name:'',surname:'',club:'',category:'',division:'recurve',hand:'right',fitarcoNumber:''},sessions:[],events:[],goals:[],rankings:[]});
let D;try{D=JSON.parse(localStorage.getItem(K))||blank()}catch(e){D=blank()}const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const TYPES={training:'Allenamento',competition:'Gara',test:'Test tecnico',simulation:'Simulazione gara',free:'Sessione libera',bareShaft:'Test spennate'},KINDS={full:'Intero',tripleVertical:'Tripla verticale'};
const RC=k=>k=='full'?10:5,sc=(r,k)=>r>=1?0:10-Math.floor(r*RC(k));
const col=s=>s>=9?['#F5D327','#000']:s>=7?['#E5382F','#fff']:s>=5?['#2BA3DE','#000']:s>=3?['#1c1c1e','#fff']:s>=1?['#f4f4f4','#000']:['#55555a','#fff'];

const A=(s,e)=>s.arrows.filter(a=>a.endIndex==e).sort((a,b)=>a.arrowIndex-b.arrowIndex),tot=a=>a.reduce((t,x)=>t+x.score,0),av=a=>a.length?tot(a)/a.length:0,pc=(a,fn)=>a.length?100*a.filter(fn).length/a.length:0;
const hasPos=s=>s.arrows.some(a=>a.x!=null),T=s=>+new Date(s.startDate),endsN=s=>s.arrows.reduce((m,a)=>Math.max(m,a.endIndex+1),0);

function disp(s){const p=s.arrows.filter(a=>a.x!=null);if(p.length<3)return null;const n=p.length,cx=p.reduce((t,a)=>t+a.x,0)/n,cy=p.reduce((t,a)=>t+a.y,0)/n,rad=s.config.size/2;return{n,cx,cy,mr:p.reduce((t,a)=>t+a.r,0)/n*rad,gr:p.reduce((t,a)=>t+Math.hypot(a.x-cx,a.y-cy),0)/n*rad}}

/* ---------- grafici SVG ---------- */
function target(kind,arrows,o={}){const rc=RC(kind);let s=`<svg viewBox="${o.vb||'-108 -108 216 216'}" id="${o.id||''}" width="100%">`;for(let k=rc;k>=1;k--){const [c]=col(11-k),sc_=11-k;s+=`<circle r="${100*k/rc}" fill="${c}" stroke="${sc_>=3&&sc_<=4?'#888':'#222'}" stroke-width=".5"/>`}
arrows.filter(a=>a.x!=null).forEach(a=>{const sel=a.id==o.sel;s+=`<circle cx="${a.x*100}" cy="${-a.y*100}" r="${(sel?4.6:3.4)/(o.z||1)}" fill="#fff" stroke="${sel?'var(--ac)':'#000'}" stroke-width="${sel?1.6:.8}"/>`;if(o.num)s+=`<text x="${a.x*100}" y="${-a.y*100+1.4}" font-size="${3.6/(o.z||1)}" text-anchor="middle" font-weight="700">${a.arrowIndex+1}</text>`});return s+'</svg>'}
function line(vals,ref,trend){if(!vals.length)return'';const W=340,H=150,all=vals.concat(ref!=null?[ref]:[],trend||[]),mn=Math.min(...all),mx=Math.max(...all),sp=Math.max(mx-mn,.2),lo=mn-sp*.2,hi=mx+sp*.2,X=i=>16+(vals.length<2?150:i*(W-32)/(vals.length-1)),Y=v=>H-14-(v-lo)/(hi-lo)*(H-28);
let s=`<svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--t3)" stroke-width="1.5" points="${vals.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`+vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--ac)"/>`).join('');
if(trend)s+=`<polyline fill="none" stroke="var(--tx)" stroke-dasharray="5 4" stroke-width="1.5" points="${trend.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
if(ref!=null)s+=`<line x1="0" x2="${W}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="var(--ok)" stroke-dasharray="4 4"/><text x="${W-4}" y="${Y(ref)-4}" text-anchor="end" font-size="11" fill="var(--ok)">target ${f(ref)}</text>`;return s+'</svg>'}
const bars=(a,max)=>`<svg viewBox="0 0 340 90">${a.map((v,i)=>{const w=340/a.length,h=Math.max(3,v/max*80);return`<rect x="${i*w+2}" y="${88-h}" width="${w-4}" height="${h}" rx="3" fill="var(--ac)"/>`}).join('')}</svg>`;
/* ---------- previsione: allenamenti prima/dopo le gare ---------- */
function predict(g){const fl=g.filter||{},ss=done().filter(s=>(!fl.distance||s.config.distance==fl.distance)&&(!fl.size||s.config.size==fl.size)&&(!fl.target||s.config.target==fl.target)),isC=s=>s.config.type=='competition'||s.isOfficial,comp=ss.filter(isC),tr=ss.filter(s=>!isC(s)),R={nComp:comp.length,nTr:tr.length},ratios=[];
comp.forEach(c=>{const pre=tr.filter(s=>T(s)<T(c)&&T(c)-T(s)<=35*DAY).slice(-6);if(pre.length>=2)ratios.push(av(c.arrows)/(pre.reduce((x,s)=>x+av(s.arrows),0)/pre.length))});

const x=post.map(s=>(T(s)-T(post[0]))/(7*DAY)),y=post.map(s=>av(s.arrows)),n=x.length,mx=x.reduce((a,b)=>a+b)/n,my=y.reduce((a,b)=>a+b)/n,sxx=x.reduce((a,b)=>a+(b-mx)**2,0)||1,b=x.reduce((a,xi,i)=>a+(xi-mx)*(y[i]-my),0)/sxx,a0=my-b*mx,

Object.assign(R,{post:y,trend:x.map(xi=>a0+b*xi),slope:b,pl,lvl:lvl(0)});
const dt=g.targetDate?+new Date(g.targetDate):(D.events.filter(e=>e.kind=='competition'&&e.status=='planned'&&+new Date(e.start)>Date.now()).map(e=>+new Date(e.start)).sort()[0]);
if(dt){const w=Math.max(0,(dt-Date.now())/(7*DAY)),L=lvl(w),band=res+sdR*L;Object.assign(R,{pred:L*fac,lo:L*fac-band,hi:Math.min(10,L*fac+band),dt})}

/* ---------- viste ---------- */
let V={tab:'home',v:null,L:null,fl:{p:0,c:''}};const P=n=>`<div class="ch">${n}</div>`;
const chips=(items,cur,a)=>P(items.map(([v,l])=>`<button class="${v==cur?'on':''}" data-a="${a}" data-v="${v}">${l}</button>`).join(''));
const kpi=(l,v,s='')=>`<div class="k"><span>${l}</span><b class="n">${v}</b>${s?`<span>${s}</span>`:''}</div>`,row=s=>`<div class="c r sp" data-a="open" data-v="${s.id}" style="cursor:pointer"><div><b>${esc(s.config.title||'Sessione')}</b><div class="t2">${fmtD(s.startDate)} · ${cfgT(s.config)}</div></div><div style="text-align:right"><div class="n" style="font-size:24px">${tot(s.arrows)}</div><div class="t3">media ${f(av(s.arrows))}</div></div></div>`;
function home(){const fin=done().reverse(),dr=D.sessions.find(s=>s.status=='draft'||s.status=='active'),l=fin.slice().reverse().flatMap(s=>s.arrows).slice(-30);
return`<h1>Ciao${D.profile.name?', '+esc(D.profile.name):''}</h1><div class="t2">${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</div>${dr?`<div class="c r sp" style="margin-top:14px"><div><b>Sessione in corso</b><div class="t2">${esc(dr.config.title)} · ${dr.arrows.length}/${dr.config.ends*dr.config.arrowsPerEnd}</div></div><button class="b m" data-a="resume" data-v="${dr.id}">Riprendi</button></div>`:''}
<div style="height:14px"></div><button class="b" data-a="new">+ Nuova sessione</button><h2>In breve</h2><div class="g">${kpi('Media ultime 30 frecce',l.length?f(av(l)):'—')}${kpi('Miglior punteggio',fin.length?Math.max(...fin.map(s=>tot(s.arrows))):'—')}</div><h2>Sessioni recenti</h2>${fin.slice(0,6).map(row).join('')||'<div class="c t2">Nessuna sessione ancora. Inizia dalla prima: ogni freccia conta.</div>'}`}
function newS(){const c=V.cfg||(V.cfg={title:'',type:'training',target:'tripleVertical',size:40,distance:18,ends:10,arrowsPerEnd:3,mode:'target'});
const sel=(k,arr)=>`<select data-c="${k}">${arr.map(v=>`<option ${v==c[k]?'selected':''}>${v}</option>`).join('')}</select>`;
return`<div class="top"><button data-a="home">‹ Indietro</button><b>Nuova sessione</b></div><label>Nome</label><input data-c="title" value="${esc(c.title)}" placeholder="Allenamento indoor ${c.distance} m"><label>Tipo</label>${chips(Object.entries(TYPES),c.type,'ctype')}<label>Bersaglio</label>${chips(Object.entries(KINDS),c.target,'ckind')}
<div class="g"><div><label>Diametro (cm)</label>${sel('size',[40,60,80,122])}</div><div><label>Distanza (m)</label>${sel('distance',[5,10,18,20,25,30,40,50,60,70])}</div><div><label>Volée</label>${sel('ends',[6,10,12,20,24,30])}</div><div><label>Frecce/volée</label>${sel('arrowsPerEnd',[3,4,5,6])}</div></div>
<label>Inserimento</label>${chips([['target','Bersaglio'],['keypad','Tastierino']],c.mode,'cmode')}<div class="t3" style="margin:6px 0 14px">${c.ends*c.arrowsPerEnd} frecce · ${cfgT(c)}</div><button class="b" data-a="start">Inizia sessione</button>`}
const S=()=>D.sessions.find(s=>s.id==V.L.id);
function live(){const s=S(),L=V.L,ea=A(s,L.end),full=ea.length>=s.config.arrowsPerEnd,k=s.config.target,tp=s.config.mode=='target',st=tot(s.arrows);
const z=L.z||1,vb=`${-108/z} ${-108/z} ${216/z} ${216/z}`;
return`<div class="top"><button data-a="exit">‹</button><div style="flex:1"><b>${esc(s.config.title)}</b><div class="t2">Volée ${L.end+1} di ${s.config.ends}</div></div><button data-a="finish">Concludi</button></div>
<div class="c r sp"><div><div class="t3">TOTALE</div><div class="n" style="font-size:38px">${st}</div></div><div><div class="t3">MEDIA</div><div class="n" style="font-size:24px">${f(av(s.arrows))}</div></div><div><div class="t3">VOLÉE</div><div class="n" style="font-size:24px">${tot(ea)}</div></div><div><div class="t3">FRECCE</div><div class="n" style="font-size:24px">${ea.length}/${s.config.arrowsPerEnd}</div></div></div>
${chips([['target','Bersaglio'],['keypad','Tastierino']],s.config.mode,'mode')}
${tp?`${k=='full'?'':chips([0,1,2].map(i=>[i,'Spot '+(i+1)]),L.spot,'spot')}<div style="max-width:420px;margin:auto">${target(k,ea.filter(a=>(a.spot||0)==L.spot),{id:'tg',vb,z,sel:L.sel,num:1})}</div>${chips([[1,'1×'],[2,'2×'],[3,'3×']],z,'zoom')}<div class="t3">Tocca per segnare · seleziona una freccia e tocca per spostarla</div>`
:`<div class="keys">${Array.from({length:RC(k)+1},(_,i)=>10-i).concat([0]).map(n=>{const[b,t]=col(n);return`<button style="background:${b};color:${t}" data-a="key" data-v="${n}">${n||'M'}</button>`}).join('')}</div>`}
<div class="ch">${ea.map((a,i)=>{const[b,t]=col(a.score);return`<button class="chip ${a.id==L.sel?'sel':''}" style="background:${b};color:${t}" data-a="chip" data-v="${a.id}">${a.score||'M'}</button>`}).join('')}<button class="b s m" data-a="del">⌫ ${L.sel?'Elimina':'Annulla'}</button></div>
<div class="r"><button class="b s m" data-a="prev" ${L.end?'':'disabled'}>‹</button><button class="b" data-a="confirm" ${full?'':'disabled'}>${L.end==s.config.ends-1?'Concludi sessione':'Conferma volée'}</button><button class="b s m" data-a="next" ${L.end>=s.config.ends-1?'disabled':''}>›</button></div>`}
function report(){const s=D.sessions.find(x=>x.id==V.rid);if(!s)return'';const a=s.arrows,d=disp(s),n=endsN(s),es=[...Array(n)].map((_,e)=>tot(A(s,e))),k=s.config.target,bins=[...Array(RC(k)+1)].map((_,i)=>10-i).concat([0]).map(v=>[v,a.filter(x=>x.score==v).length]);
const tend=d?[d.cy>.4/RC(k)?'alto':d.cy<-.4/RC(k)?'basso':'',d.cx>.4/RC(k)?'destra':d.cx<-.4/RC(k)?'sinistra':''].filter(Boolean).join('-')||'centrata':'';
return`<div class="top"><button data-a="home">‹ Home</button></div><h1>${esc(s.config.title||'Sessione')}</h1><div class="t2">${new Date(s.startDate).toLocaleString('it-IT',{dateStyle:'medium',timeStyle:'short'})} · ${TYPES[s.config.type]} · ${cfgT(s.config)}</div>
<div class="g" style="margin-top:12px">${kpi('Punteggio',tot(a))}${kpi('Media freccia',f(av(a)))}${kpi('Frecce',a.length,'/ '+s.config.ends*s.config.arrowsPerEnd)}${kpi('9 o meglio',Math.round(pc(a,x=>x.score>=9))+'%')}</div>

<h2>Punteggio per volée</h2><div class="c">${bars(es,s.config.arrowsPerEnd*10)}</div><h2>Distribuzione</h2><div class="c">${bins.map(([v,c])=>`<div class="r sp"><span class="n">${v||'M'}</span><span class="t2 n">${c} · ${Math.round(100*c/a.length)}%</span></div>`).join('')}</div>
<button class="b s" data-a="edit" data-v="${s.id}">Modifica frecce</button><div style="height:8px"></div><button class="b s d" data-a="del-s" data-v="${s.id}">Elimina sessione</button>`}
function stats(){const cf=[...new Set(done().map(s=>cfgT(s.config)))],now_=Date.now(),ss=done().filter(s=>(!V.fl.p||T(s)>=now_-V.fl.p*DAY)&&(!V.fl.c||cfgT(s.config)==V.fl.c)),a=ss.flatMap(s=>s.arrows),pts=ss.map(s=>av(s.arrows)),ma=pts.map((_,i)=>{const w=pts.slice(Math.max(0,i-2),i+1);return w.reduce((x,y)=>x+y,0)/w.length});
return`<h1>Statistiche</h1>${chips([[0,'Tutto'],[7,'7 giorni'],[30,'30 giorni'],[90,'3 mesi']],V.fl.p,'per')}<select data-fl="c"><option value="">Tutte le configurazioni</option>${cf.map(c=>`<option ${c==V.fl.c?'selected':''}>${c}</option>`).join('')}</select>
${ss.length?`<div class="g">${kpi('Sessioni',ss.length)}${kpi('Media freccia',f(av(a)))}${kpi('Frecce totali',a.length)}${kpi('9 o meglio',Math.round(pc(a,x=>x.score>=9))+'%')}</div>${cf.length>1&&!V.fl.c?'<div class="c t2" style="margin-top:10px">⚠ Configurazioni diverse: i confronti possono ingannare. Usa il filtro.</div>':''}<h2>Media freccia per sessione</h2><div class="c">${line(ma,av(a))}<div class="t3">Punti = sessioni · linea = media mobile (3) · verde = media periodo</div></div>`:'<div class="c t2">Servono dati: completa una sessione per vedere i grafici.</div>'}`}
function goals(){const g=V.gf;if(g)return`<div class="top"><button data-a="gback">‹ Indietro</button><b>Nuovo obiettivo</b></div><label>Titolo</label><input data-g="title" value="${esc(g.title)}" placeholder="es. 540 alla gara indoor">${chips([['avgArrow','Media freccia'],['totalScore','Punteggio gara']],g.metric,'gm')}<label>Valore obiettivo</label><input data-g="targetValue" inputmode="decimal" value="${g.targetValue}">
<div class="g"><div><label>Distanza (m)</label><input data-g="distance" inputmode="numeric" value="${g.filter.distance||''}"></div><div><label>Diametro (cm)</label><input data-g="size" inputmode="numeric" value="${g.filter.size||''}"></div></div>${chips([['',"Qualsiasi"],...Object.entries(KINDS)],g.filter.target||'','gk')}<label>Data della gara (facoltativa)</label><input type="date" data-g="targetDate" value="${g.targetDate?g.targetDate.slice(0,10):''}"><button class="b" data-a="gsave">Salva</button>`;
return`<div class="r sp"><h1>Obiettivi</h1><button class="b m" data-a="gnew">+ Nuovo</button></div>`+(D.goals.map(g=>{const p=predict(g),pl=p.pl||60,isT=g.metric=='totalScore',cur=p.lvl!=null?p.lvl*p.fac:null,u=v=>isT?Math.round(v*pl):f(v);let t='';
if(p.msg)t=p.msg;else{t=p.nRatio?`Fattore gara ${f(p.fac,3)} (da ${p.nRatio} gar${p.nRatio>1?'e':'a'} con allenamenti nelle 5 settimane precedenti). `:'Nessuna gara con allenamenti nelle 5 settimane precedenti: fattore gara = 1, stima meno affidabile. ';
if(p.pred!=null)t+=`<br>Previsione per il ${fmtD(p.dt)}: <b>${u(p.pred)}</b> (tra ${u(p.lo)} e ${u(p.hi)}). `;
t+=p.reached?'<br>Con l\'andamento attuale l\'obiettivo è già alla portata.':p.stall?'<br>Gli allenamenti non stanno migliorando: nessuna stima dei tempi.':p.imp?'<br>Obiettivo oltre il livello raggiungibile con questo andamento.':p.far?'<br>Obiettivo molto lontano (oltre 2 anni).':p.wk?`<br>Potresti raggiungerlo tra circa <b>${p.wk[0]}–${p.wk[1]} settimane</b>. È una stima, non una certezza.`:''}
return`<div class="c"><div class="r sp"><b>${esc(g.title||'Obiettivo')}</b><span class="t2">${isT?'punti':'media'} ${g.targetValue}</span></div><div class="t3">${p.nComp} gare · ${p.nTr} allenamenti · ${[g.filter.distance&&g.filter.distance+' m',g.filter.size&&'⌀'+g.filter.size,g.filter.target&&KINDS[g.filter.target]].filter(Boolean).join(' · ')||'tutte le configurazioni'}</div>${cur!=null?`<div class="r sp" style="margin:8px 0"><span class="n" style="font-size:26px">${u(cur)}</span><span class="t2">gara prevista oggi</span></div><div class="bar"><i style="width:${Math.min(100,cur/(isT?g.targetValue/pl:g.targetValue)*100)}%"></i></div>`:''}${p.post?line(p.post,p.tA,p.trend):''}<div class="t2" style="margin-top:8px">${t}</div><button class="b s m" style="margin-top:10px" data-a="gdel" data-v="${g.id}">Elimina</button></div>`}).join('')||'<div class="c t2">Nessun obiettivo. Impostane uno concreto e misurabile.</div>')+`<div class="t3">Modello: confronta ogni gara con gli allenamenti delle 5 settimane prima (fattore gara), poi proietta gli allenamenti successivi all'ultima gara sulla data della prossima o fino al punteggio obiettivo.</div>`}
function settings(){const p=D.profile;return`<h1>Impostazioni</h1><div class="c"><label>Tema</label>${chips([['system','Sistema'],['light','Chiaro'],['dark','Scuro']],D.settings.theme,'theme')}<label>Nome</label><input data-p="name" value="${esc(p.name)}"><label>Società</label><input data-p="club" value="${esc(p.club)}"></div>
<div class="c"><b>Backup</b><div class="t2" style="margin:4px 0 10px">Formato JSON identico a quello dell'app iPad: puoi importare il backup dell'iPad e riesportarlo.</div><button class="b s" data-a="export">Esporta backup JSON</button><div style="height:8px"></div><button class="b s" data-a="import">Importa backup (unisci)</button><div style="height:8px"></div><button class="b s d" data-a="wipe">Elimina tutti i dati</button><input type="file" id="fi" accept=".json,application/json" hidden></div>
<div class="c t2">I dati restano su questo dispositivo. Esporta un backup ogni tanto: iOS può cancellare i dati dei siti se manca spazio.</div>`}
/* ---------- render + azioni ---------- */
function render(){const el=$('#app'),th=D.settings.theme||'system';document.documentElement.dataset.t=th;let body;
if(V.v=='new')body=newS();else if(V.v=='live')body=live();else if(V.v=='report')body=report();else body=V.tab=='stats'?stats():V.tab=='goals'?goals():V.tab=='settings'?settings():home();
const nav=['home|Home','stats|Statistiche','goals|Obiettivi','settings|Impostazioni'].map(x=>{const[k,l]=x.split('|');return`<button class="${V.tab==k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`}).join('');
el.innerHTML=`<main>${body}</main>${V.v?'':`<nav>${nav}</nav>`}`;const tg=$('#tg');if(tg)tg.onclick=ev=>{const s=S(),L=V.L,k=s.config.target,pt=tg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(tg.getScreenCTM().inverse()),x=q.x/100,y=-q.y/100,ea=A(s,L.end);
if(L.sel){const i=s.arrows.findIndex(a=>a.id==L.sel),o=s.arrows[i],n=mk(o.endIndex,o.arrowIndex,x,y,L.spot,k);n.id=o.id;s.arrows[i]=n;L.sel=null;if(L.end<s.currentEnd&&!s.editedEnds.includes(L.end))s.editedEnds.push(L.end)}
else if(ea.length<s.config.arrowsPerEnd){s.arrows.push(mk(L.end,ea.length,x,y,L.spot,k));if(k!='full')L.spot=(L.spot+1)%3}else return;save();navigator.vibrate&&navigator.vibrate(10);render()}}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.c)V.cfg[t.dataset.c]=t.tagName=='SELECT'?(isNaN(t.value)?t.value:+t.value):t.value;if(t.dataset.g){const g=V.gf;if(['distance','size'].includes(t.dataset.g))g.filter[t.dataset.g]=+t.value||null;else g[t.dataset.g]=t.dataset.g=='targetValue'?parseFloat(t.value.replace(',','.'))||0:t.value}
if(t.dataset.p){D.profile[t.dataset.p]=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.c&&t.tagName=='SELECT')render();if(t.dataset.fl){V.fl.c=t.value;render()}if(t.id=='fi'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.sessions))throw 0;['sessions','events','goals','rankings'].forEach(k=>{const have=new Set(D[k].map(x=>x.id));(j[k]||[]).forEach(x=>{if(!have.has(x.id))D[k].push(x)})});if(!D.profile.name&&j.profile)D.profile=j.profile;save();alert('Backup importato: '+(j.sessions.length)+' sessioni lette.');render()}catch(e){alert('File non valido.')}};r.readAsText(t.files[0])}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;act(b.dataset.a,b.dataset.v)});
function act(a,v){const L=V.L,s=L&&S();switch(a){
case'tab':V.tab=v;V.v=null;break;case'home':V.v=null;V.tab='home';break;case'new':V.v='new';break;case'ctype':V.cfg.type=v;break;case'ckind':V.cfg.target=v;break;case'cmode':V.cfg.mode=v;break;
case'start':{const c={...V.cfg};c.title=c.title.trim()||`Allenamento ${c.distance} m`;const n={id:uid(),config:c,status:'active',startDate:now(),arrows:[],currentEnd:0,editedEnds:[],notes:'',postWorked:'',postImprove:'',postConditions:'',isOfficial:c.type=='competition',bowName:'',arrowName:'',windStrength:0,feeling:0,rpe:0};D.sessions.push(n);save();V.L={id:n.id,end:0,sel:null,spot:0,z:1};V.v='live';break}
case'resume':{const x=D.sessions.find(q=>q.id==v);x.status='active';V.L={id:x.id,end:Math.min(x.currentEnd,x.config.ends-1),sel:null,spot:0,z:1};V.v='live';break}
case'edit':{const x=D.sessions.find(q=>q.id==v);V.L={id:x.id,end:0,sel:null,spot:0,z:1,ed:1};V.v='live';break}
case'mode':s.config.mode=v;L.sel=null;save();break;case'spot':L.spot=+v;break;case'zoom':L.z=+v;break;
case'key':{const ea=A(s,L.end);if(L.sel){const o=s.arrows.find(x=>x.id==L.sel);o.score=+v;o.scoreOverridden=o.x!=null;L.sel=null}else if(ea.length<s.config.arrowsPerEnd)s.arrows.push(kp(L.end,ea.length,+v));else return;save();navigator.vibrate&&navigator.vibrate(10);break}
case'chip':L.sel=L.sel==v?null:v;{const o=s.arrows.find(x=>x.id==v);if(L.sel&&o&&o.x!=null)L.spot=o.spot||0}break;
case'del':{const ea=A(s,L.end),t=L.sel?s.arrows.find(x=>x.id==L.sel):ea[ea.length-1];if(t){s.arrows=s.arrows.filter(x=>x.id!=t.id);A(s,L.end).forEach((x,i)=>x.arrowIndex=i);L.sel=null;save()}break}
case'prev':L.end--;L.sel=null;break;case'next':L.end++;L.sel=null;break;
case'confirm':if(L.end>=s.config.ends-1){return act('finish')}if(!L.ed&&L.end>=s.currentEnd)s.currentEnd=L.end+1;L.end=L.ed?L.end+1:Math.min(s.currentEnd,s.config.ends-1);L.sel=null;save();break;
case'finish':if(L.ed){V.rid=s.id;V.v='report';break}if(!s.arrows.length||!confirm(s.arrows.length<s.config.ends*s.config.arrowsPerEnd?'Volée incomplete: salvare una sessione parziale?':'Concludere la sessione?'))return;s.status='completed';s.endDate=now();save();V.rid=s.id;V.v='report';break;
case'exit':if(s&&!L.ed)s.status='draft';save();V.v=L.ed?'report':null;V.rid=s&&s.id;break;case'open':V.rid=v;V.v='report';break;
case'del-s':if(!confirm('Eliminare questa sessione?\nQuesta azione rimuoverà definitivamente punteggi, frecce e statistiche collegate.'))return;D.sessions=D.sessions.filter(x=>x.id!=v);save();V.v=null;break;
case'per':V.fl.p=+v;break;case'gnew':V.gf={id:uid(),title:'',metric:'totalScore',targetValue:540,filter:{distance:18,size:40,target:'tripleVertical'},startDate:now(),targetDate:null,minSessions:5,status:'active',customCurrent:0,createdAt:now()};break;
case'gm':V.gf.metric=v;V.gf.targetValue=v=='avgArrow'?8.5:540;break;case'gk':V.gf.filter.target=v||null;break;case'gback':V.gf=null;break;
case'gsave':{const g=V.gf;g.title=g.title.trim()||(g.metric=='avgArrow'?'Media '+g.targetValue:g.targetValue+' punti');if(g.targetDate&&g.targetDate.length==10)g.targetDate=new Date(g.targetDate+'T12:00:00').toISOString().replace(/\.\d+Z$/,'Z');D.goals.push(g);save();V.gf=null;break}
case'gdel':D.goals=D.goals.filter(x=>x.id!=v);save();break;case'theme':D.settings.theme=v;save();break;
case'export':{const bl=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),fn='arrowscope-backup.json',fl=new File([bl],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[fl]}))navigator.share({files:[fl]}).catch(()=>{});else{const l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download=fn;l.click()}return}
case'import':$('#fi').click();return;case'wipe':if(confirm('Eliminare definitivamente tutti i dati?')){D=Object.assign(blank(),{settings:D.settings});save()}break}
render()}
render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
